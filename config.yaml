# trans-novel 配置（多语言小说 → 中文）
# 修改后无需改代码；模型提供商、流水线和输出开关都在这里。

language:
  source: auto # auto 由模型识别来源语言；也可写死 ja / en / ko / ru / de 等语言代码
  target: zh # 译文语言

# ── LLM ──────────────────────────────────────────────────────────────────
# llm:
#   # deepseek | openai | anthropic | codex | pi | codebuddy | agy | openrouter | openai-compatible | ollama | vllm | fake
#   provider: codex
#   # provider: codebuddy
#   # provider: agy
#   # codex provider 通过本机已登录的 Codex CLI（codex exec --json）调用，
#   # 不需要 base_url / api_key_env；这里显式指定可执行文件以避免 PATH 解析问题。
#   cli_path: C:\Program Files\nodejs\codex.cmd
#   # cli_path: C:\Program Files\nodejs\codebuddy.cmd
#   # cli_path: C:\Program Files\nodejs\claude.cmd
#   # cli_path: C:\Users\username\.gemini\antigravity-cli\bin\agy.cmd
#   timeout: 600
#   max_retries: 4
#   tiers:
#     strong:
#       model: gpt-5.6-sol
#       options:
#         reasoning_effort: max
#     cheap:
#       model: gpt-5.6-sol
#       options:
#         reasoning_effort: high
#     fast:
#       model: gpt-5.6-terra
#       options:
#         reasoning_effort: low
#
# ── 按 Tier 分别指定 Provider 示例（混合 provider 模式）───────────────────
# 每个 tier 可单独覆盖 provider、base_url、api_key_env、cli_path、reasoning_style 等连接字段；
# 未单独指定的字段自动继承 llm 顶层配置，若顶层未配置则回退到该 provider 默认值。
# llm:
#   provider: deepseek
#   tiers:
#     strong:
#       provider: codex
#       model: gpt-5.6-sol
#       cli_path: C:\Program Files\nodejs\codex.cmd
#     cheap:
#       provider: deepseek
#       model: deepseek-chat
#       api_key_env: DEEPSEEK_API_KEY
#     fast:
#       provider: pi
#       model: cdxpp-gpt/gpt-5.6-terra

llm_priority: "021"
# llm_priority: "210"
# llm_priority: "012"
llm_list:
  # 0号：当前 #main Pi 配置
  - provider: pi
    # pi provider 通过本机已登录的 pi agent CLI（pi -p --mode json）调用，
    # 不需要 base_url / api_key_env；鉴权由 pi 自身的登录态/模型配置负责。
    # 可省略，默认从 PATH 查找 pi；显式指定可避开 PATH 解析问题：
    cli_path: C:\Program Files\nodejs\pi.cmd
    timeout: 600
    max_retries: 4 # Wenyi 统一执行的瞬时错误重试次数；SDK 内置重试已关闭
    tiers:
      strong:
        # model: cdxpp-gpt/gpt-5.6-terra
        model: cdxpp-gpt/gpt-5.6-terra
        # model: jj-gpt-pro/gpt-5.6-terra
        # model: auto-gpt-pro/gpt-5.6-terra
        options:
          thinking: true
          reasoning_effort: high
      cheap:
        # model: auto-gemini/gemini-3.7-flash
        # model: jj-gpt-pro/gpt-5.6-terra
        model: cdxpp-gpt/gpt-5.6-terra
        options:
          thinking: true
          reasoning_effort: medium
      fast:
        # model: a6-gpt/grok-4.6
        # model: a6-gpt/DeepSeek-V4-Flash-0731
        model: a6-gpt/gemini-2.5-flash
        options:
          thinking: true
          reasoning_effort: medium

  # 1号：当前 #3.8 Agy 配置
  - provider: pi
    cli_path: C:\Program Files\nodejs\pi.cmd
    timeout: 600
    max_retries: 4
    tiers:
      strong:
        model: gemini-3.8-flash
        provider: agy
        # 顶层配了 pi 的 cli_path，此处混合 provider 必须显式指定本机真实的 agy.EXE 路径
        cli_path: C:\Users\11038\AppData\Local\agy\bin\agy.EXE
        options:
          # thinking: true
          reasoning_effort: high
      cheap:
        # model: auto-gemini/gemini-3.7-flash
        # model: jj-gpt-pro/gpt-5.6-terra
        model: gemini-3.8-flash
        provider: agy
        cli_path: C:\Users\11038\AppData\Local\agy\bin\agy.EXE
        options:
          # thinking: true
          reasoning_effort: medium
      fast:
        # model: a6-gpt/grok-4.6
        # model: a6-gpt/DeepSeek-V4-Flash-0731
        model: a6-gpt/gemini-2.5-flash
        options:
          thinking: true
          reasoning_effort: medium

  # 2号：当前 备用配置
  - provider: pi
    cli_path: C:\Program Files\nodejs\pi.cmd
    timeout: 600
    max_retries: 4
    tiers:
      strong:
        # model: cdxpp-gpt/gpt-5.6-terra
        model: modcon-gpt-mini/gpt-5.6-terra
        # model: jj-gpt-pro/gpt-5.6-terra
        # model: auto-gpt-pro/gpt-5.6-terra
        options:
          thinking: true
          reasoning_effort: high
      cheap:
        # model: auto-gemini/gemini-3.7-flash
        # model: jj-gpt-pro/gpt-5.6-terra
        model: modcon-gpt-mini/gpt-5.6-terra
        options:
          thinking: true
          reasoning_effort: medium
      fast:
        # model: a6-gpt/grok-4.6
        # model: a6-gpt/DeepSeek-V4-Flash-0731
        model: a6-gpt/gemini-2.5-flash
        options:
          thinking: true
          reasoning_effort: medium

